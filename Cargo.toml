[package]
name = "most-urls"
version = "0.0.1"
edition = "2024"

[dependencies]
flate2 = "1.1.2"
idna = "1.0.3"
nanoserde = { version = "0.2.1", default-features = false, features = [
    "std",
    "json",
] }
percent-encoding = "2.3.1"
polars = { version = "0.49.1", features = [
    "lazy",
    "polars-io",
    "dtype-u8",
    "dtype-u16",
    "dtype-categorical",
    "csv",
] }
rayon = "1.11.0"
# polars-core = { version = "0.49.1", features = ["algorithm_group_by"] }
reqwest = { version = "0.12.22", default-features = false, features = [
    "blocking",
    "rustls-tls",
    # "stream",
] }
url = "2.5.4"

# for gzip streaming
# async-compression = { version = "0.3.12", features = ["futures-io", "gzip"] }
# futures = "0.3.31"
# tokio = "1.46.1"

[profile.release]
# magic incantations to produce speedier release builds
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
